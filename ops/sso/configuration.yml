---
server:
  address: tcp://:9091/sso
  endpoints:
    authz:
      auth-request:
        implementation: AuthRequest

log:
  level: info
  format: json

theme: dark

authentication_backend:
  password_reset:
    disable: true
  password_change:
    disable: true
  file:
    path: /config/users_database.yml
    watch: true
    search:
      email: true
      case_insensitive: true
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: deny
  rules:
    - domain: bonifacio.work
      policy: one_factor
    - domain: www.bonifacio.work
      policy: one_factor

session:
  name: bonifacio_sso_session
  same_site: lax
  inactivity: 1h
  expiration: 12h
  remember_me: 30d
  cookies:
    - domain: bonifacio.work
      authelia_url: https://bonifacio.work/sso
      default_redirection_url: https://bonifacio.work/
  redis:
    host: bonifacioSsoRedis
    port: 6379
    database_index: 0
    maximum_active_connections: 8
    minimum_idle_connections: 0

regulation:
  max_retries: 5
  find_time: 10m
  ban_time: 15m

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt
