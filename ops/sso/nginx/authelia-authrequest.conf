auth_request /internal/authelia/authz;

auth_request_set $bonifacio_sso_user $upstream_http_remote_user;
auth_request_set $bonifacio_sso_groups $upstream_http_remote_groups;
auth_request_set $bonifacio_sso_name $upstream_http_remote_name;
auth_request_set $bonifacio_sso_email $upstream_http_remote_email;
auth_request_set $bonifacio_sso_redirect $upstream_http_location;

proxy_set_header Remote-User $bonifacio_sso_user;
proxy_set_header Remote-Groups $bonifacio_sso_groups;
proxy_set_header Remote-Name $bonifacio_sso_name;
proxy_set_header Remote-Email $bonifacio_sso_email;

error_page 401 =302 $bonifacio_sso_redirect;
