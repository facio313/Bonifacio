# Blog pages are public. Only the author API receives authenticated identity.
# Both origins remain loopback-only.
location = /blog {
    return 308 /blog/;
}

location = /blog/api/author {
    return 308 /blog/api/author/;
}

location ^~ /blog/api/author/ {
    auth_request /internal/authelia/authz;
    auth_request_set $blog_author_user $upstream_http_remote_user;
    auth_request_set $blog_author_groups $upstream_http_remote_groups;

    proxy_pass http://127.0.0.1:9176;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Forwarded "";
    proxy_set_header Remote-User $blog_author_user;
    proxy_set_header Remote-Groups $blog_author_groups;
    proxy_set_header Remote-Email "";
    proxy_set_header Remote-Name "";
    include /etc/nginx/snippets/blog-edge-secret.conf;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    # AuthRequest failures are JSON for the editor's fetch calls. Preserve the
    # application's own 4xx responses (including stale edits and CSRF errors).
    proxy_intercept_errors off;
    error_page 401 = @blog_login_required;
    error_page 403 = @blog_author_forbidden;
}

location @blog_login_required {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 401 '{"error":"login_required"}';
}

location @blog_author_forbidden {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 403 '{"error":"author_forbidden"}';
}

location ^~ /blog/ {
    proxy_pass http://127.0.0.1:5176;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Forwarded "";
    proxy_set_header Remote-User "";
    proxy_set_header Remote-Email "";
    proxy_set_header Remote-Name "";
    proxy_set_header Remote-Groups "";
    proxy_set_header X-Portfolio-Edge-Secret "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /_portfolio_unavailable.html;
}
