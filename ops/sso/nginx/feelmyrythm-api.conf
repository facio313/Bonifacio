# FeelMyRythm owns an application session in addition to the central edge
# session. Keep this location more specific than the general app shell so an
# application-token rejection reaches the browser as JSON. The auth_request
# access-phase 401 still uses the central SSO redirect configured by the include.
location ^~ /feelmyrythm/api/ {
    include /etc/nginx/snippets/bonifacio-sso-authrequest.conf;
    include /etc/nginx/snippets/feelmyrythm-edge-secret.conf;

    proxy_pass http://127.0.0.1:5175;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /feelmyrythm;
    proxy_read_timeout 3600s;
    client_max_body_size 50m;

    # Do not turn upstream 401 responses into the auth_request login redirect.
    proxy_intercept_errors off;
}
