daemon off;
pid /tmp/bonifacio-blog-nginx-test.pid;
error_log stderr;

events {}

http {
    access_log off;

    server {
        listen 127.0.0.1:18080;
        server_name bonifacio.invalid;

        location = /_portfolio_unavailable.html {
            return 503;
        }

        # test_blog_nginx.py stages this file and a non-production secret snippet
        # in an isolated temporary prefix before invoking nginx -t.
        include blog-public.test.rendered.conf;
    }
}
