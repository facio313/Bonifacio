daemon off;
pid /tmp/bonifacio-blog-nginx-test.pid;
error_log stderr;

events {}

http {
    access_log off;

    server {
        listen 127.0.0.1:18080;
        server_name bonifacio.invalid;

        location = /_portfolio_unavailable.html {
            return 503;
        }

        include blog-public.conf;
    }
}
